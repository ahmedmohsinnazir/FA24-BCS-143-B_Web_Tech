<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal Direct</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="d-flex align-items-center justify-content-between px-4 py-3">
        <div class="logo">
            Arsenal Direct
        </div>
        <div class="links d-flex gap-4">
            <a href="#">New In</a>
            <a href="#">Kit</a>
            <a href="#">Clothing</a>
            <a href="#">Accessories</a>
        </div>
        <div class="cart">
            <img src="icons/cart.svg" id="cart-img">
        </div>
        <div class="menu">
            <img src="icons/hamburger.svg" id="menu-img">
        </div>
    </nav>
    <h1 class="text-center my-4">Available Kits</h1>
    <div class="container-fluid">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Home Kit</h3>
                    <p>Rs. 5000</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Away Kit</h3>
                    <p>Rs. 9000</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Third Kit</h3>
                    <p>Rs. 3000</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Training Kit</h3>
                    <p>Rs. 8000</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Travel Kit</h3>
                    <p>Rs. 4000</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Retro Kit</h3>
                    <p>Rs. 4500</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Pre Match Kit</h3>
                    <p>Rs. 14000</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="product">
                    <h3>Champions Kit</h3>
                    <p>Rs. 2500</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
